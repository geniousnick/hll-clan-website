name: Deploiement Automatique
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion au serveur et mise à jour
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/l9o/htdocs/www.l9o.online
            git config --global --add safe.directory /home/l9o/htdocs/www.l9o.online
            git pull origin main
            npm install
            npm run build
            pm2 delete site-l9o || true
            pm2 start npm --name "site-l9o" -- start -- -p 4000