name: 🔄 Mise à jour Stats HLL

on:
  schedule:
    - cron: '0 23 * * *'   # Minuit CET (UTC+1) = 1h CEST en été
  workflow_dispatch:        # Permet de lancer manuellement depuis GitHub

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Installer Puppeteer (temporaire)
        run: npm install puppeteer --no-save

      - name: Lancer la mise à jour des stats
        run: node scripts/update-stats.mjs

      - name: Commit et push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/players.ts
          if git diff --staged --quiet; then
            echo "Aucun changement détecté."
          else
            git commit -m "🔄 Mise à jour automatique des stats HLL — $(date -u +'%Y-%m-%d')"
            git push
          fi
